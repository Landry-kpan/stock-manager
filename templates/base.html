<!DOCTYPE html>

<html lang="fr">

<head>


<!-- Encodage -->
<meta charset="UTF-8">

<!-- Responsive -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Titre -->
<title>{% block title %}Stock Manager{% endblock %}</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>


</head>

<body class="bg-light">


<!-- =========================
     NAVIGATION
========================== -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

    <div class="container">

        <!-- Logo -->

        <a
            class="navbar-brand fw-bold"
            href="/"
        >
            📦 Stock Manager
        </a>


        <!-- Bouton mobile -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu"
            aria-controls="navbarMenu"
            aria-expanded="false"
            aria-label="Afficher le menu"
        >

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Menu -->

        <div
            class="collapse navbar-collapse"
            id="navbarMenu"
        >

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <!-- Tableau de bord -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/"
                    >
                        Tableau de bord
                    </a>

                </li>


                <!-- Produits -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/products/"
                    >
                        Produits
                    </a>

                </li>


                <!-- Catégories -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/categories/"
                    >
                        Catégories
                    </a>

                </li>


                <!-- Stock -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/stock/"
                    >
                        Stock
                    </a>

                </li>

            </ul>


            <!-- Action principale -->

            <div class="d-flex">

                <a
                    class="btn btn-success"
                    href="/products/add/"
                >
                    + Ajouter un produit
                </a>

            </div>

        </div>

    </div>

</nav>



<!-- =========================
     CONTENU PRINCIPAL
========================== -->

<main class="container py-4">


    <!-- =========================
         MESSAGES DJANGO
    ========================== -->

    {% if messages %}

        {% for message in messages %}

            <div
                class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm"
                role="alert"
            >

                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Fermer"
                ></button>

            </div>

        {% endfor %}

    {% endif %}



    <!-- =========================
         CONTENU DES PAGES
    ========================== -->

    {% block content %}

    {% endblock %}


</main>



<!-- =========================
     FOOTER
========================== -->

<footer class="bg-dark text-white mt-5 py-4">

    <div class="container text-center">

        <p class="mb-1">
            📦 <strong>Stock Manager</strong>
        </p>

        <small class="text-secondary">
            Application de gestion de stock
        </small>

    </div>

</footer>



<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
```

</body>

</html>
