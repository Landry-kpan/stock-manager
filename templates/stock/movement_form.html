{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4 class="mb-0">
                    Nouveau mouvement de stock
                </h4>

            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Enregistrer
                    </button>

                    <a
                        href="{% url 'movement_list' %}"
                        class="btn btn-secondary"
                    >
                        Annuler
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
